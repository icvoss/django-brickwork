name: CI

# Adapted from the canonical ICV template (templates/repo/ci.yml).
# brickwork specifics:
#   - Django 6.0 FLOOR (uses core template partials); matrix is 6.0 only, no 5.2.
#   - SQLite tests (postgres service block deleted).
#   - Consumer smoke leg (brickwork#61): tests/consumer/ is a SECOND, V3-shaped
#     fixture app (multi-host shell branching, a BRICKWORK_THEME_RESOLVER tenant
#     resolver, a waffle-style feature_checker gating nav, the 422 form-swap loop,
#     and a page composing the wider component/interaction set), run as its own
#     step in the test job under settings_consumer, alongside the existing
#     settings_seams leg.
#   - Frontend build (tokens + Vite assets) and the accessibility gate
#     (axe-core/Playwright WCAG 2.2 AA, light and dark, plus the no-JS floor
#     and keyboard suite) are fully wired and blocking, not stubs: see the
#     frontend-build and a11y-gate jobs below.
#   - Template contract manifest (CHK-BLD-005, BR-BW-TPL-001/BR-BW-VER-001):
#     unlike the token manifest (rebuilt by the Node frontend-build job below),
#     this one is Django-native (it needs the app registry to resolve
#     {% load %}'d template tags), so it is generated by
#     scripts/generate_template_manifest.py and checked for drift by
#     tests/test_template_manifest.py, which already runs in the default
#     pytest leg of the test job below. No separate job is needed.
#   - Catalogue manifest (plan decision D8, W0.2): a SIBLING of the template
#     contract manifest above, never merged into it (descriptive catalogue
#     taxonomy, not a BR-BW-VER-001 contract). Generated by
#     scripts/generate_catalogue_manifest.py and checked for drift by
#     tests/test_catalogue_manifest.py, same default pytest leg, same
#     no-separate-job reasoning.
#   - A11y fixture coverage (icvoss/django-brickwork#226): every catalogue-manifest
#     shell/component/section has at least one a11y/generate_fixtures.py fixture,
#     checked by tests/test_a11y_fixture_coverage.py, which imports and runs the
#     real generator (brickwork_testapp needed), so it runs in the settings_seams
#     leg alongside test_integration.py, not the default leg.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_PYTHON_VERSION_WARNING: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff==0.15.22"
      - name: Run ruff check
        run: ruff check .
      - name: Run ruff format check
        run: ruff format --check .

  # A PR that touches a component template or adds a new @register. template
  # tag must add a changelog.d/ fragment (icvoss/django-brickwork#375). Only
  # meaningful on pull_request, where a base ref to diff against exists: the
  # push leg (a merge to main) has already passed this gate at PR time, and
  # has no PR base to diff against, so it is skipped explicitly below rather
  # than allowed to pass vacuously with no real check performed.
  changelog-gate:
    name: Changelog fragment required
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history: the script diffs against the merge base with the
          # PR's target branch, which a shallow (depth-1) checkout cannot
          # resolve.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch PR base branch
        run: git fetch origin "${{ github.base_ref }}"
      - name: Check changelog fragment
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python scripts/check_changelog_fragment_required.py \
            "origin/${{ github.base_ref }}" HEAD

  mypy:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        # Django 6.0, the package floor (see the "Django 6.0 FLOOR" note at the
        # top of this file): the [dev] extra pulls the pinned mypy + django-stubs
        # pair RELEASING.md names, and the package itself so its own imports
        # resolve during the check.
        run: |
          python -m pip install --upgrade pip
          pip install "Django~=6.0.0"
          pip install -e ".[dev]"
      - name: Run mypy
        run: mypy src/brickwork

  test:
    name: Test (Python ${{ matrix.python-version }}, Django ${{ matrix.django-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        django-version: ["6.0", "6.1"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "Django~=${{ matrix.django-version }}.0"
          # Install the package with its dev extra: this pulls pytest,
          # pytest-django, pytest-cov, django-htmx and the lint/type tools in
          # one resolved set, so a test importing an optional extra does not
          # fail collection in CI while passing locally (the DRF-drift lesson).
          pip install -e ".[dev]"
      - name: Run tests (default settings leg)
        # DJANGO_SETTINGS_MODULE (tests.settings) and pythonpath (src, ".") are set
        # in [tool.pytest.ini_options]; "." (repo root) is what makes tests.settings
        # importable as a package. The integration suite is auto-skipped here (the
        # testapp is not installed under the default leg); it runs in the seams leg.
        run: pytest tests/ -v --tb=short --color=yes --cov=brickwork --cov-report=term-missing
      - name: Run tests (settings_seams leg, testapp installed)
        # The integration tests need brickwork_testapp installed, which only happens
        # under settings_seams. That settings module imports the testapp by its bare
        # name, so tests/ must be on the path here (in addition to the pyproject
        # "src"/"." entries), hence the explicit PYTHONPATH.
        # test_a11y_fixture_coverage.py (icvoss/django-brickwork#226) is here for the
        # same reason: it imports and runs a11y/generate_fixtures.py, which itself
        # imports brickwork_testapp.forms/nav/views.
        run: pytest tests/test_integration.py tests/test_a11y_fixture_coverage.py -v --tb=short --color=yes --no-cov
        env:
          DJANGO_SETTINGS_MODULE: tests.settings_seams
          PYTHONPATH: src:.:tests
      - name: Run tests (consumer smoke leg, V3-shaped harness installed, brickwork#61)
        # The consumer smoke tests need tests/consumer/ installed, which only
        # happens under settings_consumer (a SECOND, richer fixture app than
        # brickwork_testapp, kept out of both other legs the same way).
        run: pytest tests/test_consumer_smoke.py -v --tb=short --color=yes --no-cov
        env:
          DJANGO_SETTINGS_MODULE: tests.settings_consumer
          PYTHONPATH: src:.:tests

  # ── Frontend build: tokens (Style Dictionary) + assets (Vite) ────────
  # Rebuilds the tokens + component bundle from source and asserts the committed
  # stable-named artefacts match a clean build (so a source edit without a
  # rebuild cannot ship stale artefacts).
  frontend-build:
    name: Frontend build (tokens + assets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install frontend deps
        run: npm ci
      - name: Build tokens + assets
        run: npm run build
      - name: Assert stable-named artefacts exist
        run: |
          for f in tokens.css tailwind-theme.css tokens.js brickwork.css brickwork.js; do
            test -s "src/brickwork/static/brickwork/dist/$f" || { echo "missing/empty $f"; exit 1; }
          done
      - name: Assert committed token artefacts are up to date with source
        # The Style Dictionary token outputs are deterministic, so a clean rebuild
        # must not change them (else the DTCG source and shipped tokens have
        # drifted). Scoped to the token files, not the Vite bundle, whose exact
        # minified bytes can vary across Node/OS and are not a useful drift signal.
        run: |
          git diff --exit-code -- \
            src/brickwork/static/brickwork/dist/tokens.css \
            src/brickwork/static/brickwork/dist/tokens.js \
            src/brickwork/static/brickwork/dist/tailwind-theme.css \
            || { echo "Committed token artefacts are stale. Run 'npm run build:tokens' and commit."; exit 1; }

  # ── Accessibility + no-JS gate (load-bearing, the package's core promise) ──
  # axe-core WCAG 2.2 AA against the REAL rendered pages in light AND dark, plus
  # the no-JS floor suite (shell navigable with JS disabled, form errors wired)
  # and the skip-link keyboard check. axe finds ~57% of issues, so the keyboard +
  # no-JS assertions are wired alongside it, not axe alone; manual AT review is a
  # release-gate step on top.
  #   - W0.3 archetype-test harness (a11y/archetypes.spec.mjs): a SEPARATE
  #     fixture set (a11y/fixtures/archetypes/), rendered by its own generator
  #     (a11y/generate_archetype_fixtures.py, npm run a11y:fixtures:archetypes)
  #     BEFORE Playwright runs. Both fixture-generation steps must run every
  #     time: the archetype fixtures are gitignored, so a skipped or failed
  #     generation step here means the specs auto-discover zero fixtures.
  #     Closed by two separate, independently-teeth-checked assertions
  #     (icvoss/django-brickwork#382), because they fail for different
  #     reasons and a single combined check cannot tell them apart: a
  #     non-zero fixture-count check straight after each generation step
  #     below (a dead or skipped generator), and a non-zero
  #     tests-ran check read from Playwright's own JSON reporter stats after
  #     the suite runs (a scan that found fixtures and still registered
  #     nothing). Both are on top of, not instead of, the in-spec length
  #     guards in axe.spec.mjs and archetypes.spec.mjs themselves, which fire
  #     when a spec is run directly rather than only under this wrapper.
  a11y-gate:
    name: Accessibility + no-JS gate (WCAG 2.2 AA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          npm ci
      - name: Lint the a11y Playwright specs (icvoss/django-brickwork#276)
        run: npm run a11y:lint
      - name: Build the frontend bundle (fixtures inline it)
        run: npm run build
      # --with-deps IS SAFE HERE ONLY BECAUSE THIS JOB IS runs-on:
      # ubuntu-latest. The flag shells out to the OS package manager for
      # Chromium's system libraries, which needs root, and a throwaway
      # GitHub-hosted VM has it. Read the flag and the runner class together:
      # they are one fact, and they sit fifteen lines apart in this file.
      #
      # Anyone copying this step to a SELF-HOSTED runner should drop the flag:
      # a runner with no_new_privs set cannot elevate, so sudo fails outright
      # rather than degrading to a plain download, and the step dies before
      # the gate runs. The browser download itself needs no root; the OS
      # libraries belong on the runner image, since they are a property of the
      # box rather than of a CI run. A failure to LAUNCH chromium there is a
      # provisioning gap wanting a fix on the image, never a restored flag.
      #
      # Recorded because this step has already been copied verbatim into a
      # consuming site's self-hosted workflow and failed there
      # (icvoss/brickworkui.com#114): the job SHAPE transferred correctly and
      # this one runner-class-dependent flag inside it did not. A working
      # precedent is evidence about its own environment.
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Render a11y fixtures (real pages, light + dark)
        run: npm run a11y:fixtures
      - name: Assert page fixtures were generated (icvoss/django-brickwork#382)
        # A dead or skipped generator leaves a11y/fixtures/ empty (or
        # missing); axe.spec.mjs's own for-loops would then register zero
        # tests and this job would go green having scanned nothing. Checked
        # here, straight after generation and before Playwright starts, so
        # the failure is attributed to the generator rather than surfacing
        # three steps later as an unexplained "0 tests ran".
        run: |
          count=$(find a11y/fixtures -maxdepth 1 -name '*.html' | wc -l)
          echo "page fixtures: $count"
          test "$count" -gt 0 || { echo "a11y/fixtures/ has no .html fixtures; the generator produced nothing."; exit 1; }
      - name: Render archetype-harness fixtures (catalogue-manifest archetypes, light + dark)
        run: npm run a11y:fixtures:archetypes
      - name: Assert archetype fixtures were generated (icvoss/django-brickwork#382)
        # Same failure mode as the page-fixture check above, for the
        # separate a11y/fixtures/archetypes/ tree archetypes.spec.mjs scans.
        run: |
          count=$(find a11y/fixtures/archetypes -maxdepth 1 -name '*.html' 2>/dev/null | wc -l)
          echo "archetype fixtures: $count"
          test "$count" -gt 0 || { echo "a11y/fixtures/archetypes/ has no .html fixtures; the generator produced nothing."; exit 1; }
      - name: Run axe-core WCAG 2.2 AA + no-JS + keyboard suite
        run: npm run a11y
      - name: Assert the suite actually ran tests (icvoss/django-brickwork#382)
        # Distinct failure mode from the fixture-count checks above: fixtures
        # can exist while a spec's own enumeration still finds nothing (a
        # filter bug, a path mismatch), which the fixture-count checks
        # cannot see because they only look at the filesystem, never at what
        # Playwright actually collected. Read from the json reporter's own
        # stats (playwright.config.mjs), never grepped from console text: a
        # console message can be reworded without this check noticing,
        # the reporter's stats object cannot lie about what ran. Runs only
        # when the suite step above itself succeeded (default GitHub Actions
        # behaviour): a real violation already fails the job at that step,
        # so this check exists purely for the exit-0-but-scanned-nothing case.
        run: |
          test -f a11y-results.json || { echo "a11y-results.json was not written; the json reporter did not run."; exit 1; }
          python3 -c "
          import json, sys
          with open('a11y-results.json') as f:
              stats = json.load(f)['stats']
          ran = stats['expected'] + stats['unexpected'] + stats['flaky']
          print(f'tests ran: {ran} (expected={stats[\"expected\"]}, unexpected={stats[\"unexpected\"]}, flaky={stats[\"flaky\"]}, skipped={stats[\"skipped\"]})')
          sys.exit(0 if ran > 0 else 1)
          " || { echo "the a11y suite registered and ran zero tests; a spec's own enumeration found nothing."; exit 1; }
