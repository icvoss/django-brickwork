name: Publish django-brickwork to PyPI

# Public publish workflow (OIDC trusted publishing to PyPI). brickwork
# graduated from the private index (pypi.icvoss.com) to public PyPI; this
# replaces publish-private.yml.
#
# OIDC trusted publishing: no API token or Actions secret is required.
# Configure the trusted publisher in the PyPI project settings:
#   Publisher: GitHub Actions
#   Owner: icvoss
#   Repository: django-brickwork
#   Workflow: publish.yml
#   Environment: pypi
# The `pypi` GitHub environment must exist on this repo (Settings ->
# Environments -> pypi); add a required reviewer there to gate each publish.
#
# Triggered by tags of the form: v1.0.0rc1
#
# Pushing a v* tag IS publishing (irreversible). PyPI rejects a re-upload of
# an existing version file name; treat versions as immutable and never re-tag
# a published version. CI refuses to publish without a matching CHANGELOG
# entry (the resolve job's gate below).

on:
  push:
    tags:
      - "v*"

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_PYTHON_VERSION_WARNING: "1"
  PACKAGE_NAME: django-brickwork

permissions:
  contents: write
  # OIDC trusted publishing to PyPI: the publish job exchanges this token for a
  # short-lived PyPI credential, so no API token or Actions secret is stored.
  id-token: write

jobs:
  # 1. Parse version from the tag
  resolve:
    name: Resolve version from tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      release_title: ${{ steps.parse.outputs.release_title }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
    steps:
      - name: Parse tag
        id: parse
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          if [[ -z "$VERSION" ]]; then
            echo "ERROR: Could not parse version from tag '$TAG'"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_title=django-brickwork v${VERSION}" >> "$GITHUB_OUTPUT"
          # A version is a pre-release if it is 0.x OR carries a PEP 440
          # pre-release / dev marker (rc, a, b, alpha, beta, dev). The old
          # startsWith('0.') check wrongly flagged 1.0.0rc1 as a full release.
          if [[ "$VERSION" =~ ^0\. || "$VERSION" =~ (a|b|rc|alpha|beta|dev)[0-9]* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Version: $VERSION"

      - uses: actions/checkout@v6

      - name: Require a CHANGELOG entry for this version
        env:
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          CHANGELOG="CHANGELOG.md"
          if [[ ! -f "$CHANGELOG" ]]; then
            echo "ERROR: $CHANGELOG does not exist. Every release must ship a CHANGELOG."
            exit 1
          fi
          # Require a heading like "## [0.4.0]" (date and surrounding text optional).
          if ! grep -qE "^##[[:space:]]+\[${VERSION//./\\.}\]" "$CHANGELOG"; then
            echo "ERROR: No CHANGELOG entry found for version ${VERSION} in $CHANGELOG."
            echo "Add a '## [${VERSION}] - <date>' section (rename [Unreleased]) before tagging."
            echo "See RELEASING.md - every release must ship a dated CHANGELOG entry."
            exit 1
          fi
          echo "Found CHANGELOG entry for ${VERSION}."

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Require no leftover changelog fragments (icvoss/django-brickwork#375)
        # Additive to the heading check above, not a replacement: a heading is
        # satisfiable by a hand-written "## [<version>]" line with no fragment
        # ever assembled into it, which is exactly how v3.13.0 shipped without
        # naming four capabilities (icvoss/django-brickwork#361). This asserts
        # the assembler actually ran against THIS commit: it deletes every
        # fragment it consumes, so anything still in changelog.d/ here was
        # missed.
        run: python scripts/check_no_leftover_fragments.py

  # 2. Run the test suite before publishing
  test:
    name: Test django-brickwork
    runs-on: ubuntu-latest
    needs: resolve

    # No Postgres service: brickwork ships no models and tests on SQLite.

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Gate on the ARTEFACT, not the source tree (icvoss/icv-oss-umbrella#543).
      # An editable install puts src/ on sys.path, so the suite runs against
      # the working tree and never touches the wheel being published: a module
      # missing from packages.find, an absent py.typed, a template or data file
      # left out of the wheel, all pass every leg and ship broken. Build the
      # wheel here and install THAT.
      - name: Build the wheel this job will test
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist/

      - name: Install the built wheel and test dependencies
        run: |
          pip install dist/*.whl
          pip install "Django~=6.0.0"
          # Test dependencies only, matching the `dev` extra's non-lint
          # entries (pytest, pytest-django, pytest-cov, django-htmx). The
          # package itself comes from the wheel above, so this must never be
          # `pip install -e .` or `.[dev]`: either puts the source tree back
          # on sys.path and silently defeats the whole point of this job.
          pip install pytest pytest-django pytest-cov "django-htmx>=1.28"

      # THE TRAP, read before editing either line below. Installing the wheel
      # is NOT sufficient on its own. pyproject.toml sets
      # `pythonpath = ["src", "."]` under [tool.pytest.ini_options]: "src" is
      # the package (must be dropped, or it shadows the wheel) and "." is the
      # repo root, kept because DJANGO_SETTINGS_MODULE is "tests.settings",
      # which only resolves as a package with the repo root on sys.path (see
      # the comment on pythonpath in pyproject.toml). There is no job env
      # PYTHONPATH here to also fix: this repo's publish.yml never set one.
      # `-o pythonpath=.` overrides pyproject to keep "." and drop "src". The
      # guard step then fails the job if the package still resolves outside
      # site-packages, so a future edit that reintroduces "src" cannot pass
      # silently.
      - name: Confirm pytest resolves the package from the wheel
        run: |
          cat > _wheel_guard.py <<'PY'
          import os

          import brickwork


          def test_package_resolves_from_the_installed_wheel():
              origin = os.path.realpath(brickwork.__file__)
              assert "site-packages" in origin, (
                  f"the source tree shadowed the wheel: {origin}"
              )
          PY
          python -m pytest _wheel_guard.py -q -o pythonpath=.
          rm _wheel_guard.py

      # Publish smoke gate: run the DEFAULT leg only. Any leg that needs its
      # own settings module or service (a locations sub-app, a postgres
      # concurrency leg) runs in full on the merged PR via ci.yml, and fails
      # if collected here under the default settings. Deselect those markers
      # exactly as ci.yml's default leg does; a package with no such markers
      # deselects nothing (harmless). icv-commerce omitted this and its
      # v1.0.0rc1 publish gate collected locations/postgres tests it could not
      # satisfy.
      # DJANGO_SETTINGS_MODULE (tests.settings) comes from
      # [tool.pytest.ini_options] in pyproject.toml; do not override it here.
      # `-o pythonpath=.` overrides only the pythonpath entry (see the guard
      # step comment above), dropping "src" while keeping "." so
      # tests.settings still resolves. Default leg only (the seams/integration
      # leg runs on the merged PR via ci.yml). brickwork has no
      # postgres/locations markers to deselect.
      - name: Run tests
        run: pytest tests/ -v --tb=short --color=yes --no-cov --ignore=tests/test_integration.py -o pythonpath=.

  # 3. Build wheel and sdist
  build:
    name: Build django-brickwork
    runs-on: ubuntu-latest
    needs: [resolve, test]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify CHANGELOG ships in both distributions
        run: |
          unzip -l dist/*.whl | grep -qE 'share/doc/django-brickwork/CHANGELOG\.md$'
          tar -tzf dist/*.tar.gz | grep -qE '/CHANGELOG\.md$'

      - name: Verify distributions with twine
        run: twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-django-brickwork-${{ needs.resolve.outputs.version }}
          path: dist/
          if-no-files-found: error

  # 4. Publish to PyPI via OIDC trusted publishing. No API token or secret:
  # the `pypi` environment plus id-token: write authenticates the upload
  # (see the header note for the PyPI project trusted-publisher config).
  publish:
    name: Publish django-brickwork to PyPI
    runs-on: ubuntu-latest
    needs: [resolve, build]
    environment: pypi

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-django-brickwork-${{ needs.resolve.outputs.version }}
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # 5. Create GitHub Release
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [resolve, publish]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-django-brickwork-${{ needs.resolve.outputs.version }}
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ needs.resolve.outputs.release_title }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ needs.resolve.outputs.prerelease }}
          fail_on_unmatched_files: true
