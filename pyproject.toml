[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-brickwork"
version = "3.7.0"
description = "Brand-agnostic interface foundation for server-rendered Django, across public, product, data, documentation, editorial and transactional interfaces. WCAG 2.2 AA tested in CI; not a Django-admin skin."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{name = "Nigel Copley"}]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: User Interfaces",
]
keywords = [
    "django",
    "ui",
    "design-system",
    "tailwind",
    "alpine",
    "htmx",
    "accessibility",
    "wcag",
    "components",
]
# Django 6.0 floor: the package uses core template partials
# ({% partialdef %} / render(request, "t#partial")) with no compat shim.
#
# Django is the ONLY hard runtime dependency. Deliberately NOT depended on
# (build-tool research 2026-07-30, a library inherits every dep five times):
#   - django-htmx: brickwork's own need is one boolean (HX-Request header). It
#     inlines that check and duck-types request.htmx when a consumer already
#     runs django-htmx. Offered as the optional [htmx] extra, never forced.
#   - django-vite: unnecessary. brickwork ships STABLE (non-hashed) asset
#     filenames referenced by plain {% static %}; there is no Vite manifest to
#     resolve. (Also stale: no Django 5.x/6.x support.)
#   - django-tailwind / -cli: irrelevant. They manage a Tailwind build inside a
#     live Django project; brickwork compiles its CSS in its OWN repo (Vite +
#     @tailwindcss/vite) and ships the precompiled artefact.
# Tailwind/Alpine/HTMX are FRONTEND runtime (loaded via <link>/<script> against
# the shipped static assets), not Python packages. @alpinejs/ui + @alpinejs/focus
# are host-owned peer deps delivered by the consumer's own Vite/npm build.
dependencies = [
    "Django>=6.0",
]

[project.urls]
Homepage = "https://github.com/icvoss/django-brickwork"
Documentation = "https://github.com/icvoss/django-brickwork"
Changelog = "https://github.com/icvoss/django-brickwork/blob/main/CHANGELOG.md"
"Issue Tracker" = "https://github.com/icvoss/django-brickwork/issues"
"Source Code" = "https://github.com/icvoss/django-brickwork"

[project.optional-dependencies]
# Optional: consumers already running django-htmx get brickwork's HTMX-aware
# helpers using the richer request.htmx surface. brickwork's core never imports
# it (it inlines the HX-Request header check + duck-types request.htmx), so
# consumers without this extra are unaffected.
htmx = ["django-htmx>=1.28"]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "django-htmx>=1.28",
    # Pinned EXACTLY to the version .github/workflows/ci.yml installs
    # (icvoss/django-brickwork#110). A range here let a local `ruff format`
    # reformat files a newer release formats differently, so `ruff format
    # --check` passed locally and failed on CI (or vice versa) with no source
    # change between them. Bump this and the CI pin in the same commit.
    "ruff==0.15.22",
    "mypy>=1.10",
    # django-stubs provides the Django annotations py.typed does not (Django itself
    # ships no inline types); pinned to the 6.0.x stub line to match the Django 6.0
    # floor CI tests against (icvoss/django-brickwork#207). django-stubs releases
    # track Django minors, and the 6.0.x line typechecks cleanly against the 6.1
    # runtime this repo also tests, so one pin covers both matrix legs.
    "django-stubs~=6.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship templates, the compiled CSS/JS/token artefacts (built by the frontend
# pipeline into static/brickwork/dist), the vendored icon artwork the registry
# loads at import, the DTCG token source, and the PEP 561 typed marker.
brickwork = [
    "py.typed",
    "templates/**/*.html",
    "static/**/*",
    "icons/vendor/**/*.svg",
    "tokens/source/**/*.json",
    # The copy-paste example pages (2.0.0, ADR-056). Shipped as package DATA
    # under examples/, deliberately NOT under templates/: APP_DIRS only walks
    # <app>/templates/, so no consumer configuration can make the loader
    # resolve an example, and the only way to use one is to open it and copy
    # it. Read from an installed package via brickwork.examples.
    # The tree's own README ships too: it is the copy-paste instructions, and
    # someone reading the examples in an installed wheel needs them there.
    "examples/**/*.html",
    "examples/README.md",
]
# brickwork.marketing (1.2.0, ADR-055): the opt-in marketing kit sub-app.
# Templates only, in their own brickwork_marketing/ namespace; it compiles
# into the same brickwork.css bundle (frontend/src/marketing.css), so it
# ships no static/ tree of its own.
"brickwork.marketing" = [
    "templates/**/*.html",
]

[tool.setuptools.data-files]
# Keep release notes beside other installed documentation, rather than copying a
# second source of truth into the importable ``brickwork`` package. Setuptools
# includes data-files in both the wheel and the sdist.
"share/doc/django-brickwork" = ["CHANGELOG.md"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
# "." (repo root) so `tests.settings` resolves as a package; "src" for the
# package. NOT "tests" itself: that would put tests/'s contents at top level and
# shadow the `tests` package, breaking the `tests.settings` import (CI-caught).
# The seams leg additionally needs `brickwork_testapp` importable; its CI step
# and the a11y fixtures set PYTHONPATH=src:.:tests for that.
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501", "SIM105"]

[tool.ruff.lint.isort]
known-first-party = ["brickwork"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = false
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
# django-stubs needs a real settings module to resolve dynamic Django attributes
# (e.g. settings.AUTH_USER_MODEL). tests/settings.py is the default test leg's
# settings module and is always importable with the [dev] extra installed.
django_settings_module = "tests.settings"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "if __name__ =="]
