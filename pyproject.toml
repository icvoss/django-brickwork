[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saas-ui"
version = "0.0.0"
description = "Brand-agnostic, app-facing professional UI substrate for server-rendered Django (Tailwind 4, Alpine 3, HTMX 2). Accessible by construction; not a Django-admin skin."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{name = "Nigel Copley"}]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: User Interfaces",
]
keywords = [
    "django",
    "ui",
    "design-system",
    "tailwind",
    "alpine",
    "htmx",
    "accessibility",
    "wcag",
    "components",
]
# Django 6.0 floor: the package uses core template partials
# ({% partialdef %} / render(request, "t#partial")) with no compat shim.
#
# Django is the ONLY hard runtime dependency. Deliberately NOT depended on
# (build-tool research 2026-07-30, a library inherits every dep five times):
#   - django-htmx: saas_ui's own need is one boolean (HX-Request header). It
#     inlines that check and duck-types request.htmx when a consumer already
#     runs django-htmx. Offered as the optional [htmx] extra, never forced.
#   - django-vite: unnecessary. saas_ui ships STABLE (non-hashed) asset
#     filenames referenced by plain {% static %}; there is no Vite manifest to
#     resolve. (Also stale: no Django 5.x/6.x support.)
#   - django-tailwind / -cli: irrelevant. They manage a Tailwind build inside a
#     live Django project; saas_ui compiles its CSS in its OWN repo (Vite +
#     @tailwindcss/vite) and ships the precompiled artefact.
# Tailwind/Alpine/HTMX are FRONTEND runtime (loaded via <link>/<script> against
# the shipped static assets), not Python packages. @alpinejs/ui + @alpinejs/focus
# are host-owned peer deps delivered by the consumer's own Vite/npm build.
dependencies = [
    "Django>=6.0",
]

[project.urls]
Homepage = "https://github.com/icvoss/saas-ui"
Documentation = "https://github.com/icvoss/saas-ui"
Changelog = "https://github.com/icvoss/saas-ui/blob/main/CHANGELOG.md"
"Issue Tracker" = "https://github.com/icvoss/saas-ui/issues"
"Source Code" = "https://github.com/icvoss/saas-ui"

[project.optional-dependencies]
# Optional: consumers already running django-htmx get saas_ui's HTMX-aware
# helpers using the richer request.htmx surface. saas_ui's core never imports
# it (it inlines the HX-Request header check + duck-types request.htmx), so
# consumers without this extra are unaffected.
htmx = ["django-htmx>=1.28"]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "django-htmx>=1.28",
    "ruff>=0.5.0",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship templates, the compiled CSS/JS/token artefacts (built by the frontend
# pipeline into static/saas_ui/dist), and the PEP 561 typed marker.
saas_ui = [
    "py.typed",
    "templates/**/*.html",
    "static/**/*",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501", "SIM105"]

[tool.ruff.lint.isort]
known-first-party = ["saas_ui"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = false

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "if __name__ =="]
